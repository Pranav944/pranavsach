<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'todo/st.css' %}">


</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <form method="POST" action="{% url 'add_task' %}">
            {% csrf_token %}
            <input type="text" name="title" placeholder="New Task">
            <button type="submit">Add</button>
        </form>
        <ul>
            {% for task in tasks %}
                <li>
                    {{ task.title }}
                    {% if not task.completed %}
                        <a href="{% url 'complete_task' task.id %}" class="complete-btn">Complete</a>
                    {% endif %}
                    <a href="{% url 'delete_task' task.id %}" class="delete-btn">Delete</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
